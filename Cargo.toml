[package]
name = "tetherline"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "End-to-end encrypted, conflict-aware sync for your own devices; the server only ever stores ciphertext"
license = "MIT"
repository = "https://github.com/cybercoretech/tetherline"
keywords = ["sync", "encryption", "age", "local-first", "crdt"]
categories = ["cryptography", "data-structures"]

[dependencies]
age = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
